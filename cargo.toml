[package]
name = "ai-model-manager"
version = "1.0.3"
edition = "2021"

[dependencies]
slint = "1.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
winreg = "0.52"
rfd = "0.14"
sysinfo = "0.30"
wmi = "0.13"

[build-dependencies]
slint-build = "1.5.1"
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"